spring.datasource.url=jdbc:h2:mem:restobar_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.main.banner-mode=off
spring.profiles.active=test
# El perfil test necesita su propia propiedad de seed (DataSeeder la resuelve sin default).
app.seed.password=${SEED_PASSWORD:restobar2026}
