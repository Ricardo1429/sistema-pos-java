# La password local se lee de un fichero fuera del repo para que el arranque
# funcione igual desde el IDE, la terminal o el jar, sin exportar variables.
# Si DB_PASSWORD existe como variable de entorno, esa tiene prioridad.
spring.config.import=optional:file:${user.home}/.config/restobar/pos-dev.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restobar}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.seed.password=${SEED_PASSWORD:restobar2026}
