spring.application.name=restobar-pos
# F-02: sin perfil por defecto. Arrancar sin --spring.profiles.active debe fallar (fail-fast),
# nunca caer en un perfil con H2 console habilitada y ddl-auto=update.
server.port=8081
# F-02: valor global seguro; la H2 console solo se habilita explicitamente en el perfil dev.
spring.h2.console.enabled=false
# F-02: sin perfil explicito no hay datasource. La URL base es un sentinel que no
# corresponde a ningun driver y el fallback a base de datos embebida queda deshabilitado,
# de modo que arrancar sin --spring.profiles.active falla (fail-fast) en lugar de levantar
# una BD efimera. Los perfiles dev y cloud redefinen spring.datasource.url.
spring.datasource.url=jdbc:restobar:sin-datasource-configurado
spring.datasource.embedded-database-connection=none
# open-in-view=true: las vistas Thymeleaf iteran colecciones lazy (orden.detalles,
# menu/caja) fuera del controlador; sin OSIV cada plantilla exigiria cerrar la sesion
# JPA manualmente dentro del handler. Decision consciente para esta fase de vistas.
spring.jpa.open-in-view=true
# F-01: la password de seed NO se empaqueta en el jar. Se define por perfil
# (dev con default de desarrollo, cloud sin default y fail-fast).
