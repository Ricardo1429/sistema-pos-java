spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Supavisor (pooler compartido, puerto 6543) no admite prepared statements con nombre
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# F-01: sin default. Si SEED_PASSWORD no esta definida el arranque falla (fail-fast)
# en vez de crear usuarios con una clave conocida.
app.seed.password=${SEED_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-cloud.sql
spring.sql.init.continue-on-error=false
