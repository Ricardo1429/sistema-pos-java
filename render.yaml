services:
  - type: web
    name: restobar-pos
    runtime: java
    plan: free
    region: oregon
    buildCommand: ./mvnw -B clean package -DskipTests
    startCommand: java -jar target/pos-1.0.0.jar --spring.profiles.active=cloud --server.port=$PORT
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEED_PASSWORD
        sync: false
