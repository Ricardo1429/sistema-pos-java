services:
  - type: web
    name: restobar-pos
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEED_PASSWORD
        sync: false
